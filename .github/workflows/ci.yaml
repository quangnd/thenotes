name: Build and Test

on:
  pull_request:
    branches:
      - v5
  push:
    branches:
      - v5
  workflow_dispatch:

jobs:
  build-and-test:
    if: ${{ github.repository == 'jackyzha0/quartz' || (github.repository == 'quangnd/thenotes' && github.event_name == 'pull_request') }}
    name: PR / ${{ matrix.check }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.repository == 'jackyzha0/quartz' && '["windows-latest", "macos-latest", "ubuntu-latest"]' || '["ubuntu-latest"]') }}
        check: [check, test, build]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: pr-validation-${{ runner.os }}-node-24-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            pr-validation-${{ runner.os }}-node-24-

      - name: Cache Quartz plugins
        uses: actions/cache@v5
        with:
          path: .quartz/plugins
          key: pr-validation-${{ runner.os }}-plugins-${{ hashFiles('quartz.lock.json', 'quartz.config.yaml', 'plugins/**', 'quartz/cli/plugin-git-handlers.js') }}

      - run: npm ci

      - name: Install Quartz plugins
        run: npm run quartz -- plugin install

      - name: Apply local Quartz plugin patches
        shell: bash
        run: |
          bash scripts/patch-quartz-plugins.sh
          node scripts/patch-quartz-slugify.mjs

      - name: Check types and style
        if: matrix.check == 'check'
        run: npm run check

      - name: Test
        if: matrix.check == 'test'
        run: npm test

      - name: Ensure Quartz builds, check bundle info
        if: matrix.check == 'build'
        run: npm run quartz -- build --bundleInfo -d docs

  publish-tag:
    if: ${{ github.repository == 'jackyzha0/quartz' && github.ref == 'refs/heads/v5' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Get package version
        run: node -p -e '`PACKAGE_VERSION=${require("./package.json").version}`' >> $GITHUB_ENV
      - name: Create release tag
        uses: pkgdeps/git-tag-action@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_repo: ${{ github.repository }}
          version: ${{ env.PACKAGE_VERSION }}
          git_commit_sha: ${{ github.sha }}
          git_tag_prefix: "v"
